<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUSTOO | THE LEGEND 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syncopate:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --p1: #ff007f; --p2: #00d4ff; --p3: #ffcc00; --dark: #000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--dark); color: #fff; font-family: 'Poppins', sans-serif; overflow: hidden; }

        /* --- 1. BOOT LOADER --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .load-box { width: 280px; text-align: center; }
        .bar-bg { width: 100%; height: 3px; background: rgba(255,255,255,0.1); margin: 20px 0; overflow: hidden; }
        #bar-fill { width: 0%; height: 100%; background: var(--p2); box-shadow: 0 0 15px var(--p2); }
        .status { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--p2); letter-spacing: 3px; }

        /* --- 2. LIQUID BACKGROUND --- */
        #bg-container { position: fixed; inset: 0; z-index: -1; background: #000; overflow: hidden; }
        .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.5; animation: floatOrb 20s infinite alternate; }
        @keyframes floatOrb { from { transform: translate(0,0) scale(1); } to { transform: translate(20vw, 15vh) scale(1.3); } }

        /* --- 3. MAIN CONTENT --- */
        #main-site { display: none; opacity: 0; transition: 1.5s ease; height: 100vh; overflow-y: auto; overflow-x: hidden; }

        /* Welcome/Hero Animation */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .welcome-tag { font-family: 'Orbitron'; color: var(--p2); letter-spacing: 10px; opacity: 0; margin-bottom: 10px; }
        .main-name { 
            font-family: 'Syncopate'; font-size: clamp(3rem, 15vw, 9rem); 
            text-transform: uppercase; opacity: 0; transform: scale(0.8); filter: blur(10px);
        }

        /* Classes for JS Trigger */
        .animate-title { animation: zoomInName 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        .animate-tag { animation: fadeInTop 1s forwards 0.5s; }

        @keyframes zoomInName { to { opacity: 1; transform: scale(1); filter: blur(0); } }
        @keyframes fadeInTop { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        /* Vaults */
        .vault-section { padding: 100px 20px; text-align: center; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; max-width: 1100px; margin: 40px auto; }
        .vault-card { 
            background: rgba(255,255,255,0.05); padding: 50px 20px; border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.4s; backdrop-filter: blur(10px);
        }
        .vault-card:hover { transform: translateY(-10px); border-color: var(--p2); background: rgba(0, 212, 255, 0.05); }
        .vault-card i { font-size: 3rem; color: var(--p3); margin-bottom: 15px; }

        /* Gift */
        .gift-box { font-size: 8rem; cursor: pointer; animation: pulse 2s infinite; display: inline-block; margin: 50px 0; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* Final Reveal */
        #reveal-zone { display: none; padding-bottom: 100px; text-align: center; opacity: 0; transition: 1s; }
        .hbd-banner { font-family: 'Syncopate'; font-size: clamp(2rem, 10vw, 5rem); color: var(--p3); margin-bottom: 40px; text-shadow: 0 0 30px var(--p3); }
        .video-box { width: 90%; max-width: 900px; margin: 0 auto; border-radius: 30px; overflow: hidden; border: 6px solid #111; box-shadow: 0 0 80px rgba(255,0,127,0.3); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 11000; justify-content: center; align-items: center; }
        #modal-img { max-width: 85%; max-height: 80vh; border-radius: 15px; }

        #music-btn { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--p3); border: none; z-index: 1000; cursor: pointer; }
    </style>
</head>
<body onload="startSystem()">

    <div id="loader">
        <div class="load-box">
            <h2 style="font-family: 'Syncopate'; letter-spacing: 5px;">FLUSTOO</h2>
            <div class="bar-bg"><div id="bar-fill"></div></div>
            <div class="status" id="status-text">INITIALIZING...</div>
        </div>
    </div>

    <div id="bg-container">
        <div class="orb" style="width:600px; height:600px; background:var(--p1); top:-10%; left:-10%;"></div>
        <div class="orb" style="width:500px; height:500px; background:var(--p2); bottom:-10%; right:-10%; animation-delay:-5s;"></div>
        <div class="orb" style="width:400px; height:400px; background:#6000ff; top:40%; left:30%; animation-delay:-10s;"></div>
    </div>

    <div id="main-site">
        <button id="music-btn" onclick="toggleMusic()"><i class="fas fa-play"></i></button>
        <audio id="hbd-music" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3" type="audio/mpeg"></audio>

        <section class="hero">
            <p class="welcome-tag" id="tag">LEVEL_20_ACTIVE</p>
            <h1 class="main-name" id="hero-title">FLUSTOO</h1>
            <p style="margin-top: 20px; letter-spacing: 5px; opacity: 0.4;">SCROLL TO OPEN VAULTS</p>
        </section>

        <section class="vault-section">
            <h2 style="font-family: 'Orbitron'; color: var(--p2); margin-bottom: 30px;">SECURE DATA VAULTS</h2>
            <div class="vault-grid">
                <div class="vault-card" onclick="openVault('party')"><i class="fas fa-file-image"></i><h3>VAULT_01</h3></div>
                <div class="vault-card" onclick="openVault('squad')"><i class="fas fa-file-image"></i><h3>VAULT_02</h3></div>
                <div class="vault-card" onclick="openVault('trips')"><i class="fas fa-file-image"></i><h3>VAULT_03</h3></div>
                <div class="vault-card" onclick="openVault('old')"><i class="fas fa-file-image"></i><h3>VAULT_04</h3></div>
            </div>

            <div style="margin-top: 100px;">
                <h2 style="font-family: 'Orbitron'; color: var(--p1);">FINAL SURPRISE</h2>
                <div class="gift-box" onclick="revealBirthday()">🎁</div>
            </div>
        </section>

        <div id="reveal-zone">
            <h1 class="hbd-banner">HAPPY BIRTHDAY!</h1>
            <div class="video-box">
                <video id="hbd-video" width="100%" controls><source src="1.mp4" type="https://youtu.be/o0htackbwWQ"></video>
            </div>
            <h2 style="font-family: 'Orbitron'; color: var(--p2); margin-top: 30px; letter-spacing: 10px;">FLUSTOO THE BOSS</h2>
        </div>
    </div>

    <div id="vaultModal" class="modal">
        <span onclick="closeVault()" style="position:absolute; top:30px; right:40px; font-size:3rem; cursor:pointer;">&times;</span>
        <img id="modal-img" src="">
        <div style="margin-top: 20px;">
            <button onclick="changeImg(-1)" style="padding:10px 20px; background:none; border:1px solid #fff; color:#fff; cursor:pointer;">PREV</button>
            <button onclick="changeImg(1)" style="padding:10px 20px; background:none; border:1px solid #fff; color:#fff; cursor:pointer;">NEXT</button>
        </div>
    </div>

    <script>
        // --- 1. BOOT SYSTEM ---
        function startSystem() {
            let fill = document.getElementById('bar-fill');
            let status = document.getElementById('status-text');
            let val = 0;
            let interval = setInterval(() => {
                val += Math.floor(Math.random() * 8) + 1;
                if(val >= 100) {
                    val = 100;
                    clearInterval(interval);
                    status.innerText = "ACCESS GRANTED!";
                    setTimeout(exitLoader, 800);
                }
                fill.style.width = val + "%";
            }, 100);
        }

        function exitLoader() {
            document.getElementById('loader').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('loader').style.display = "none";
                const site = document.getElementById('main-site');
                site.style.display = "block";
                setTimeout(() => {
                    site.style.opacity = "1";
                    document.body.style.overflow = "auto";
                    // TRIGGER WELCOME ANIMATION
                    document.getElementById('hero-title').classList.add('animate-title');
                    document.getElementById('tag').classList.add('animate-tag');
                }, 100);
            }, 800);
        }

        // --- 2. VAULT LOGIC ---
        const photoDB = {
            'party': ['https://picsum.photos/800/600?r=1', 'https://picsum.photos/800/600?r=2'],
            'squad': ['https://picsum.photos/800/600?r=3'],
            'trips': ['https://picsum.photos/800/600?r=4'],
            'old': ['https://picsum.photos/800/600?r=5']
        };
        let currentCat = 'party', currentIdx = 0;

        function openVault(cat) {
            currentCat = cat; currentIdx = 0;
            updateModalImg();
            document.getElementById('vaultModal').style.display = 'flex';
        }
        function closeVault() { document.getElementById('vaultModal').style.display = 'none'; }
        function changeImg(dir) {
            currentIdx = (currentIdx + dir + photoDB[currentCat].length) % photoDB[currentCat].length;
            updateModalImg();
        }
        function updateModalImg() { document.getElementById('modal-img').src = photoDB[currentCat][currentIdx]; }

        // --- 3. REVEAL LOGIC ---
        function revealBirthday() {
            const zone = document.getElementById('reveal-zone');
            document.querySelector('.gift-box').innerHTML = "🔥";
            setTimeout(() => {
                zone.style.display = 'block';
                setTimeout(() => {
                    zone.style.opacity = '1';
                    zone.scrollIntoView({ behavior: 'smooth' });
                    document.getElementById('hbd-music').play();
                    document.getElementById('hbd-video').play();
                }, 100);
            }, 800);
        }

        function toggleMusic() {
            const m = document.getElementById('hbd-music');
            m.paused ? m.play() : m.pause();
        }
    </script>
</body>

</html>
